name: leaf_scanner
description: Offline plant leaf disease scanner (non-commercial portfolio project).
publish_to: 'none'
version: 1.4.1+8

environment:
  sdk: '>=3.3.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  onnxruntime: ^1.4.1
  image: ^4.2.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model.onnx
    - assets/classes.json
    - assets/knowledge.json
    - assets/knowledge_hi.json
    - assets/knowledge_mr.json
    - assets/ui.json
    - assets/config.json
